name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-tested-cpu.txt
      - name: Install CPU runtime
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-tested-cpu.txt
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts examples
      - run: python -m pytest -q
      - run: python -m iap doctor
      - run: python -m iap audit --repository .
      - run: python -m build
      - name: Verify wheel in an isolated target directory
        run: python scripts/check_wheel.py
